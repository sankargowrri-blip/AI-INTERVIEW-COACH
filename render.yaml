services:
  - type: web
    name: ai-interview-coach-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-coach-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: ai-interview-coach-db
    plan: free
    databaseName: ai_interview_coach
    user: ai_coach_user
