services:
  - type: web
    name: ai-interview-coach-backend
    env: python
    plan: free
    rootDir: backend

    # buildCommand runs ONCE per deploy, not on every cold-start restart.
    # Running alembic here instead of in startCommand means migrations only
    # happen during deploys, not every time Render spins the instance back up
    # after 15-min inactivity.  This removes 3–8 s from every cold-start.
    buildCommand: pip install -r requirements.txt && alembic upgrade head

    # startCommand is executed on every cold-start.
    # Keeping it to pure uvicorn launch minimises spin-up latency.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-coach-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: ai-interview-coach-db
    plan: free
    databaseName: ai_interview_coach
    user: ai_coach_user
